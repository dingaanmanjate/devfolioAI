# .github/workflows/deploy.yml
name: Deploy Streamlit App to AWS EB (Python)

on:
  push:
    branches:
      - main # or master

env:
  EB_PACKAGE_NAME: "streamlit-app-${{ github.sha }}"
  EB_ENVIRONMENT_NAME: Devfolio-env # <<< UPDATE THIS
  EB_APPLICATION_NAME: devfolio  # <<< UPDATE THIS
  EB_REGION: "us-east-1"                 # <<< UPDATE THIS

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Zip the necessary application files (app.py, Procfile, requirements.txt, etc.)
      - name: Create deployment package
        run: |
          zip -r ${{ env.EB_PACKAGE_NAME }}.zip . -x ".git/*" ".github/*" "local-secrets.toml" 
          # Crucially, ensure Procfile, requirements.txt, and app.py are included.

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.EB_REGION }}

      # 3. Deploy to Elastic Beanstalk
      - name: Deploy application to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v24 
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          region: ${{ env.EB_REGION }}
          version_label: ${{ github.sha }}
          deployment_package: ${{ env.EB_PACKAGE_NAME }}.zip
          wait_for_deployment: true
          wait_for_environment_cname: true